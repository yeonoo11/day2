<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 특산물 에이전트</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; background: #fff8ef; color: #333; }
  header { background: linear-gradient(135deg, #ff9f1c, #e4572e); color: #fff; padding: 14px 16px; text-align: center; font-weight: bold; font-size: 1.1rem; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 720px; width: 100%; margin: 0 auto; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .me { align-self: flex-end; background: #e4572e; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #f0d9b5; border-bottom-left-radius: 4px; }
  form { display: flex; gap: 8px; padding: 10px 16px; max-width: 720px; width: 100%; margin: 0 auto; }
  #input { flex: 1; min-width: 0; padding: 12px; font-size: 1rem; border: 1px solid #e0c9a0; border-radius: 20px; }
  #send { padding: 0 20px; font-size: 1rem; border: 0; border-radius: 20px; background: #e4572e; color: #fff; cursor: pointer; }
  .note { text-align: center; font-size: .75rem; color: #999; padding: 0 16px 10px; }
</style>
</head>
<body>
  <header>🍊 제주 특산물 에이전트</header>

  <div id="chat"></div>

  <form id="form">
    <input id="input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
    <button id="send" type="submit">보내기</button>
  </form>
  <div class="note">※ 지금 답변은 미리 정해 둔 가짜 답이에요.</div>

<script>
  const REPLIES = [
    '안녕하세요, 수민 님! 🍊 저는 제주도 특산물을 알려주는 에이전트예요. 감귤, 한라봉, 흑돼지 중에 어떤 게 궁금하세요?',
    '귤이 궁금하시다면 제주 감귤을 추천해요! 늦가을부터 겨울까지 새콤달콤하게 가장 맛있어요 😋',
    '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.'
  ];
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  let turn = 0;

  function add(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    add(text, 'me');
    input.value = '';
    const reply = REPLIES[turn % REPLIES.length];
    turn++;
    setTimeout(() => add(reply, 'bot'), 1000);
  });
</script>
</body>
</html>
