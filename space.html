<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Voyage</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #ui {
    position: fixed; left: 16px; bottom: 14px; color: #9fb4ff; font: 13px/1.5 system-ui, sans-serif;
    display: flex; gap: 12px; align-items: center;
  }
  #ui button {
    background: rgba(40,60,140,.45); color: #cfe0ff; border: 1px solid #4a63d0; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font: inherit;
  }
  #ui button:hover { background: rgba(70,100,220,.6); }
  #ui span { opacity: .65; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <button id="cam">카메라: 자유 시점 (C)</button>
  <span>드래그: 회전 · 휠: 줌</span>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(0, 45, 95);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxDistance = 400;

// ---------- 유틸: 절차적 텍스처 ----------
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return (hash(xi, yi) * (1 - u) + hash(xi + 1, yi) * u) * (1 - v) +
         (hash(xi, yi + 1) * (1 - u) + hash(xi + 1, yi + 1) * u) * v;
}
function fbm(x, y) { let a = 0.5, s = 0; for (let i = 0; i < 5; i++) { s += a * vnoise(x, y); x *= 2; y *= 2; a *= 0.5; } return s; }

function planetTexture(palette, { bands = 0, scale = 4, seed = 0 } = {}) {
  const W = 512, H = 256;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'); const img = ctx.createImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let n = fbm(x / W * scale * 2 + seed, y / H * scale + seed);
    if (bands) n = 0.55 * n + 0.45 * (0.5 + 0.5 * Math.sin(y / H * bands * Math.PI * 2 + n * 4));
    const t = Math.min(0.999, Math.max(0, n)) * (palette.length - 1);
    const i = Math.floor(t), f = t - i;
    const a = palette[i], b = palette[i + 1] || a;
    const o = (y * W + x) * 4;
    img.data[o] = a[0] + (b[0] - a[0]) * f;
    img.data[o + 1] = a[1] + (b[1] - a[1]) * f;
    img.data[o + 2] = a[2] + (b[2] - a[2]) * f;
    img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}
function glowTexture(inner, outer) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, inner); g.addColorStop(0.25, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(cv);
}

// ---------- 별 배경 ----------
{
  const N = 6000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const r = 900 + Math.random() * 600, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)], i * 3);
    c.setHSL(Math.random() < 0.5 ? 0.6 : 0.08, 0.5, 0.6 + Math.random() * 0.4);
    col.set([c.r, c.g, c.b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 2.2, vertexColors: true, sizeAttenuation: false, depthWrite: false })));
  // 성운
  const nebColors = ['rgba(120,60,255,.35)', 'rgba(40,140,255,.3)', 'rgba(255,70,150,.25)'];
  nebColors.forEach((cc, i) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(cc, cc.replace(/[\d.]+\)$/, '.1)')), blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    const a = i * 2.2 + 0.5;
    s.position.set(Math.cos(a) * 1100, (i - 1) * 250, Math.sin(a) * 1100);
    s.scale.setScalar(1100);
    scene.add(s);
  });
}

// ---------- 태양 ----------
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(10, 64, 64),
  new THREE.MeshBasicMaterial({ map: planetTexture([[255, 120, 20], [255, 200, 60], [255, 245, 170]], { scale: 6, seed: 3 }) })
);
scene.add(sun);
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture('rgba(255,220,120,1)', 'rgba(255,140,40,.35)'), blending: THREE.AdditiveBlending, depthWrite: false }));
sunGlow.scale.setScalar(60);
scene.add(sunGlow);
scene.add(new THREE.PointLight(0xfff0d0, 6e4, 0, 2));
scene.add(new THREE.AmbientLight(0x202838, 1.5));

// ---------- 행성 ----------
const planetDefs = [
  { name: 'mercury', r: 1.2, d: 20, sp: 0.9, pal: [[90, 85, 80], [170, 160, 150], [120, 115, 110]], sc: 8 },
  { name: 'venus',   r: 2.2, d: 28, sp: 0.65, pal: [[200, 150, 80], [240, 210, 140], [190, 130, 70]], sc: 3, bands: 4 },
  { name: 'earth',   r: 2.4, d: 38, sp: 0.5, pal: [[10, 40, 120], [20, 80, 170], [40, 140, 70], [200, 190, 150], [250, 250, 250]], sc: 4, moon: true },
  { name: 'mars',    r: 1.7, d: 48, sp: 0.4, pal: [[120, 50, 30], [200, 100, 50], [150, 70, 40]], sc: 6 },
  { name: 'jupiter', r: 6, d: 78, sp: 0.22, pal: [[150, 100, 70], [230, 200, 160], [180, 120, 80], [240, 225, 200]], sc: 3, bands: 9 },
  { name: 'saturn',  r: 5, d: 108, sp: 0.15, pal: [[180, 150, 100], [235, 215, 160], [200, 175, 120]], sc: 3, bands: 7, ring: true },
  { name: 'uranus',  r: 3.4, d: 134, sp: 0.1, pal: [[110, 190, 200], [160, 225, 230], [120, 200, 210]], sc: 3, bands: 3 },
  { name: 'neptune', r: 3.3, d: 156, sp: 0.07, pal: [[30, 60, 180], [60, 110, 230], [40, 80, 200]], sc: 3, bands: 5 },
];
const planets = [];
planetDefs.forEach((p, i) => {
  const pivot = new THREE.Object3D(); pivot.rotation.y = Math.random() * Math.PI * 2;
  scene.add(pivot);
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(p.r, 48, 48),
    new THREE.MeshStandardMaterial({ map: planetTexture(p.pal, { bands: p.bands, scale: p.sc, seed: i * 7 }), roughness: 0.9 })
  );
  mesh.position.x = p.d; mesh.rotation.z = 0.2 + i * 0.05;
  pivot.add(mesh);
  if (p.ring) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(p.r * 1.4, p.r * 2.4, 128),
      new THREE.MeshBasicMaterial({ color: 0xd8c496, side: THREE.DoubleSide, transparent: true, opacity: 0.6 }));
    ring.rotation.x = Math.PI / 2 - 0.45;
    mesh.add(ring);
  }
  let moon = null;
  if (p.moon) {
    moon = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 24), new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 1 }));
    scene.add(moon);
  }
  // 궤도선
  const pts = []; for (let k = 0; k <= 128; k++) { const a = k / 128 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * p.d, 0, Math.sin(a) * p.d)); }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x3a4a88, transparent: true, opacity: 0.25 })));
  planets.push({ ...p, pivot, mesh, moon });
});

// ---------- 소행성대 ----------
const belt = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.35, 0),
  new THREE.MeshStandardMaterial({ color: 0x8a8378, roughness: 1, flatShading: true }), 1800);
const dummy = new THREE.Object3D(), beltData = [];
for (let i = 0; i < 1800; i++) {
  const a = Math.random() * Math.PI * 2, d = 58 + Math.random() * 12;
  beltData.push({ a, d, y: (Math.random() - 0.5) * 3, s: 0.4 + Math.random() * 1.4, rot: Math.random() * 6 });
}
scene.add(belt);

// ---------- 우주선 ----------
const ship = new THREE.Group();
{
  const hull = new THREE.MeshStandardMaterial({ color: 0xd8dde8, metalness: 0.8, roughness: 0.3 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x3a4258, metalness: 0.6, roughness: 0.4 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 2.4, 16), hull);
  body.rotation.x = Math.PI / 2; ship.add(body);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1.2, 16), hull);
  nose.rotation.x = Math.PI / 2; nose.position.z = 1.8; ship.add(nose);
  const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0x66ccff, emissive: 0x2288ff, emissiveIntensity: 0.8 }));
  cockpit.position.set(0, 0.32, 0.7); cockpit.scale.set(1, 0.8, 1.6); ship.add(cockpit);
  for (const s of [-1, 1]) {
    const wing = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.07, 1.1), dark);
    wing.position.set(s * 1.0, 0, -0.6); wing.rotation.y = s * -0.35; ship.add(wing);
    const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.9, 12), hull);
    eng.rotation.x = Math.PI / 2; eng.position.set(s * 1.6, 0, -1.1); ship.add(eng);
    const flame = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture('rgba(180,230,255,1)', 'rgba(60,140,255,.5)'), blending: THREE.AdditiveBlending, depthWrite: false }));
    flame.position.set(s * 1.6, 0, -1.7); flame.scale.setScalar(1.6); flame.name = 'flame'; ship.add(flame);
  }
  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.8, 0.9), dark);
  fin.position.set(0, 0.5, -1.0); ship.add(fin);
  ship.add(new THREE.PointLight(0x66aaff, 40, 20, 2));
  ship.scale.setScalar(1.4);
}
scene.add(ship);

// 비행 경로 (폐곡선): 행성계를 가로지르며 상하로 출렁임
const route = new THREE.CatmullRomCurve3([
  [70, 6, 0], [45, 12, 50], [10, 4, 40], [-25, -6, 25], [-60, 10, 45], [-95, 14, 10],
  [-70, 0, -50], [-20, -10, -45], [20, -4, -25], [35, 8, -60], [80, 16, -55], [100, 4, -20],
].map(p => new THREE.Vector3(...p)), true, 'catmullrom', 0.5);

// 엔진 트레일
const TRAIL = 220;
const trailPos = new Float32Array(TRAIL * 3), trailCol = new Float32Array(TRAIL * 3);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol, 3));
const trail = new THREE.Points(trailGeo, new THREE.PointsMaterial({
  size: 0.3, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
trail.frustumCulled = false;
scene.add(trail);
const trailHist = [];

// 경로선 (은은하게)
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(route.getPoints(300)),
  new THREE.LineDashedMaterial({ color: 0x66aaff, dashSize: 1, gapSize: 2, transparent: true, opacity: 0.0 })));

// ---------- 카메라 모드 ----------
let follow = false;
const btn = document.getElementById('cam');
function toggleCam() {
  follow = !follow;
  controls.enabled = !follow;
  btn.textContent = follow ? '카메라: 우주선 추적 (C)' : '카메라: 자유 시점 (C)';
  if (!follow) { controls.target.set(0, 0, 0); }
}
btn.onclick = toggleCam;
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'c') toggleCam(); });

// ---------- 루프 ----------
const clock = new THREE.Clock();
const camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3(), look = new THREE.Vector3();
const tmpP = new THREE.Vector3(), tmpT = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  sun.rotation.y += dt * 0.05;
  planets.forEach(p => {
    p.pivot.rotation.y += dt * p.sp * 0.25;
    p.mesh.rotation.y += dt * 0.4;
    if (p.moon) {
      const w = new THREE.Vector3(); p.mesh.getWorldPosition(w);
      p.moon.position.set(w.x + Math.cos(t * 1.5) * 4, w.y + Math.sin(t * 0.7), w.z + Math.sin(t * 1.5) * 4);
    }
  });
  for (let i = 0; i < beltData.length; i++) {
    const b = beltData[i], a = b.a + t * 0.03;
    dummy.position.set(Math.cos(a) * b.d, b.y, Math.sin(a) * b.d);
    dummy.rotation.set(b.rot + t * 0.3, b.rot * 2, 0);
    dummy.scale.setScalar(b.s);
    dummy.updateMatrix(); belt.setMatrixAt(i, dummy.matrix);
  }
  belt.instanceMatrix.needsUpdate = true;

  // 우주선 이동
  const u = (t * 0.018) % 1;
  route.getPointAt(u, tmpP);
  route.getTangentAt(u, tmpT);
  ship.position.copy(tmpP);
  ship.lookAt(tmpP.clone().add(tmpT));
  // 기울임(롤): 곡선 방향 변화에 따라
  const t2 = route.getTangentAt((u + 0.01) % 1);
  const turn = tmpT.clone().cross(t2).y;
  ship.rotateZ(THREE.MathUtils.clamp(-turn * 40, -0.7, 0.7));
  const pulse = 1.4 + Math.sin(t * 30) * 0.25;
  ship.children.forEach(c => { if (c.name === 'flame') c.scale.setScalar(pulse); });

  // 트레일
  trailHist.unshift(ship.localToWorld(new THREE.Vector3(0, 0, -2.4)));
  if (trailHist.length > TRAIL) trailHist.pop();
  for (let i = 0; i < TRAIL; i++) {
    const p = trailHist[Math.min(i, trailHist.length - 1)];
    trailPos.set([p.x, p.y, p.z], i * 3);
    const f = trailHist.length > i ? 1 - i / TRAIL : 0;
    trailCol.set([0.1 * f * f, 0.3 * f * f, 0.6 * f * f], i * 3);
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;

  if (follow) {
    camGoal.copy(tmpP).addScaledVector(tmpT, -9).addScaledVector(up, 3.5);
    lookGoal.copy(tmpP).addScaledVector(tmpT, 12);
    camera.position.lerp(camGoal, 1 - Math.exp(-dt * 4));
    look.lerp(lookGoal, 1 - Math.exp(-dt * 6));
    camera.lookAt(look);
  } else {
    controls.update();
    look.copy(tmpP);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
