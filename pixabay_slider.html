<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixabay 이미지 슬라이더</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; padding: 20px 16px; background: #f4f4f4; color: #222; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  input { padding: 10px; font-size: 1rem; border: 1px solid #bbb; border-radius: 6px; }
  #q { flex: 1; min-width: 160px; }
  #key { flex: 1 1 100%; }
  button { padding: 10px 16px; font-size: 1rem; border: 0; border-radius: 6px; background: #2b7de9; color: #fff; cursor: pointer; }
  button:disabled { background: #aaa; cursor: default; }
  #msg { min-height: 1.4em; color: #c0392b; margin: 6px 0; }
  .slider { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 4 / 3; display: none; }
  .slider img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.5); font-size: 1.5rem; padding: 8px 14px; }
  #prev { left: 8px; } #next { right: 8px; }
  .bar { display: none; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; flex-wrap: wrap; }
  .credit { font-size: .85rem; color: #555; }
  .thumbs { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
  .thumbs img { width: 64px; height: 48px; object-fit: cover; border-radius: 4px; cursor: pointer; opacity: .6; }
  .thumbs img.on { opacity: 1; outline: 2px solid #2b7de9; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖼️ Pixabay 이미지 슬라이더</h1>

  <form id="form">
    <input id="key" type="password" placeholder="Pixabay API Key 입력 (이 브라우저에만 저장돼요)" autocomplete="off">
    <input id="q" type="text" placeholder="검색어 (예: 제주 귤, jeju, mandarin)" required>
    <button type="submit">검색</button>
  </form>
  <div id="msg"></div>

  <div class="slider" id="slider">
    <img id="photo" alt="">
    <button class="arrow" id="prev" type="button" aria-label="이전">‹</button>
    <button class="arrow" id="next" type="button" aria-label="다음">›</button>
  </div>
  <div class="bar" id="bar">
    <span id="pos"></span>
    <span class="credit" id="credit"></span>
    <span>
      <button id="prevPage" type="button">◀ 이전 10개</button>
      <button id="nextPage" type="button">다음 10개 ▶</button>
    </span>
  </div>
  <div class="thumbs" id="thumbs"></div>
</div>

<script>
  const PER_PAGE = 10;
  const $ = id => document.getElementById(id);
  let query = '', page = 1, totalHits = 0, images = [], idx = 0;

  try { $('key').value = localStorage.getItem('pixabay_key') || ''; } catch (e) {}

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    query = $('q').value.trim();
    try { localStorage.setItem('pixabay_key', $('key').value.trim()); } catch (e) {}
    page = 1;
    load();
  });

  async function load() {
    const key = $('key').value.trim();
    if (!key) { $('msg').textContent = 'API Key를 입력해 주세요.'; return; }
    $('msg').textContent = '불러오는 중…';
    const url = 'https://pixabay.com/api/?' + new URLSearchParams({
      key, q: query, image_type: 'photo', per_page: PER_PAGE, page, safesearch: 'true'
    });
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status === 400 ? 'API Key나 요청이 올바르지 않아요.' : '오류 ' + res.status);
      const data = await res.json();
      images = data.hits;
      totalHits = data.totalHits;
      idx = 0;
      if (!images.length) { $('msg').textContent = '검색 결과가 없어요.'; show(false); return; }
      $('msg').textContent = '';
      show(true);
      render();
    } catch (err) {
      $('msg').textContent = err.message;
      show(false);
    }
  }

  function show(on) {
    $('slider').style.display = on ? 'block' : 'none';
    $('bar').style.display = on ? 'flex' : 'none';
    if (!on) $('thumbs').innerHTML = '';
  }

  function render() {
    const img = images[idx];
    $('photo').src = img.webformatURL;
    $('photo').alt = img.tags;
    $('pos').textContent = `${(page - 1) * PER_PAGE + idx + 1} / ${totalHits}`;
    $('credit').textContent = `📷 ${img.user} · Pixabay`;
    $('prevPage').disabled = page <= 1;
    $('nextPage').disabled = page * PER_PAGE >= totalHits;
    $('thumbs').innerHTML = '';
    images.forEach((im, i) => {
      const t = document.createElement('img');
      t.src = im.previewURL;
      t.alt = im.tags;
      if (i === idx) t.className = 'on';
      t.addEventListener('click', () => { idx = i; render(); });
      $('thumbs').appendChild(t);
    });
  }

  $('prev').addEventListener('click', () => { idx = (idx - 1 + images.length) % images.length; render(); });
  $('next').addEventListener('click', () => { idx = (idx + 1) % images.length; render(); });
  $('prevPage').addEventListener('click', () => { page--; load(); });
  $('nextPage').addEventListener('click', () => { page++; load(); });
</script>
</body>
</html>
