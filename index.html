<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>three.js Animation</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; }
  canvas { display: block; }
  #go {
    position: fixed; top: 16px; right: 16px; padding: 10px 18px; border-radius: 8px;
    background: rgba(40,60,140,.55); color: #dfe8ff; border: 1px solid #4a63d0;
    font: 600 15px system-ui, sans-serif; text-decoration: none; z-index: 10;
  }
  #go:hover { background: rgba(70,100,220,.75); }
  #hint {
    position: fixed; left: 16px; bottom: 14px; color: #8fa3ff; font: 13px/1.4 system-ui, sans-serif;
    opacity: .7; pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<a id="go" href="space.html">🚀 우주 여행 시작</a>
<div id="hint">마우스 이동: 시점 회전 · 드래그: 궤도 · 휠: 줌</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060d, 0.035);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

// 중앙 토러스 매듭
const knot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(2, 0.6, 220, 32),
  new THREE.MeshStandardMaterial({ color: 0x6c7bff, metalness: 0.7, roughness: 0.2 })
);
scene.add(knot);

// 와이어프레임 외곽 구
const shell = new THREE.Mesh(
  new THREE.IcosahedronGeometry(4.2, 2),
  new THREE.MeshBasicMaterial({ color: 0x3a4aff, wireframe: true, transparent: true, opacity: 0.25 })
);
scene.add(shell);

// 궤도를 도는 작은 구들
const orbiters = [];
for (let i = 0; i < 6; i++) {
  const color = new THREE.Color().setHSL(i / 6, 0.8, 0.6);
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 24, 24),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.8 })
  );
  const light = new THREE.PointLight(color, 25, 14);
  m.add(light);
  scene.add(m);
  orbiters.push({ m, r: 5.5 + i * 0.5, speed: 0.4 + i * 0.12, tilt: i * 0.5, phase: i });
}

// 파티클 필드
const N = 2500;
const pos = new Float32Array(N * 3);
const col = new Float32Array(N * 3);
const c = new THREE.Color();
for (let i = 0; i < N; i++) {
  const r = 8 + Math.random() * 30;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  pos.set([r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph)], i * 3);
  c.setHSL(0.55 + Math.random() * 0.25, 0.8, 0.65);
  col.set([c.r, c.g, c.b], i * 3);
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.08, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false,
  blending: THREE.AdditiveBlending
}));
scene.add(points);

scene.add(new THREE.AmbientLight(0x404060, 1.2));

const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();

  knot.rotation.x = t * 0.3;
  knot.rotation.y = t * 0.5;
  const s = 1 + Math.sin(t * 1.5) * 0.06;
  knot.scale.setScalar(s);

  shell.rotation.y = -t * 0.1;
  shell.rotation.x = t * 0.05;

  for (const o of orbiters) {
    const a = t * o.speed + o.phase;
    o.m.position.set(
      Math.cos(a) * o.r,
      Math.sin(a) * o.r * Math.sin(o.tilt),
      Math.sin(a) * o.r * Math.cos(o.tilt)
    );
  }

  points.rotation.y = t * 0.02;
  points.rotation.x = Math.sin(t * 0.1) * 0.1;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
